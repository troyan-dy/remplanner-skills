# Линтер — wemake-python-styleguide (dev-инструмент, нужен Python ≥ 3.10; сами инструменты — Python 3.9+ без
# сторонних пакетов, CLAUDE.md). Запуск: pip install -r requirements-dev.txt && flake8
[flake8]
select = WPS
max-line-length = 120
exclude =
    .git,
    __pycache__,
    skills/setup-remplanner-skills/toolkit/catalog
per-file-ignores =
    # planlib — публичный API генераторов (src/*.py проектов квартир, docstring и tools/blocks.py — его индекс):
    # одна плоская библиотека, разбивать её на модули — менять импорты у пользователей и вывод blocks.py
    skills/setup-remplanner-skills/toolkit/planlib.py: WPS202
